[package]
name = "goat"
version = "1.0.5"
edition = "2021"
description = "A Rust web browser built on WebView2"
license-file = "LICENSE"
publish = false

[dependencies]
wry = { version = "0.57", features = ["devtools"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
urlencoding = "2"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"
tar = "0.4.46"
raw-window-handle = "0.6"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"] }
png = "0.18"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_EnhancedStorage", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[patch.crates-io]
# Pop-up windows without winit's 1px shadow line (see vendor/egui-winit/src/lib.rs).
egui-winit = { path = "vendor/egui-winit" }
